name: Instagram yayin
on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  yayin:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analiz
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PYTHONUTF8: "1"
        run: cd yayin && python analiz.py > /dev/null
      - name: Yayin
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          PYTHONUTF8: "1"
        run: cd yayin && python yayinla.py sira
      - name: Kaydet
        if: always()
        run: |
          git config user.name "ajansiz-yayin"
          git config user.email "yayin@users.noreply.github.com"
          git add yayin/analiz yayin/kayit.json
          git diff --cached --quiet || git commit -m "Yayin kaydi $(date -u +%F)"
          git pull --rebase origin main
          git push origin main
